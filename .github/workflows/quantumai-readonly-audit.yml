name: QuantumAI Read-Only Skill Validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'QuantumAI-Native-Control-Center-Self-Agent/**'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 QuantumAI-Native-Control-Center-Self-Agent/scripts/validate_skill.py --root QuantumAI-Native-Control-Center-Self-Agent
      - run: python3 -m unittest discover -s QuantumAI-Native-Control-Center-Self-Agent/tests -v
